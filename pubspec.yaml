name: drishti_ai
description: "DrishtiAI — Smart AI-powered accessibility assistant for visually impaired users."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^17.0.0

  # Typography
  google_fonts: ^6.2.1

  # Local Storage
  shared_preferences: ^2.5.3

  # Camera + OCR
  camera: ^0.11.2+1
  google_mlkit_text_recognition: ^0.15.0
  permission_handler: ^12.0.1
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.5
  http: ^1.2.2
  image: ^4.2.0
  onnxruntime: ^1.4.0
  url_launcher: ^6.3.0
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

dependency_overrides:
  google_mlkit_commons:
    path: vendor/google_mlkit_commons

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/models/
